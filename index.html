<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060f" />
    <title>Gesture Lab</title>
    <style>
      html, body { margin: 0; background: #07060f; color: #ecebff; font-family: system-ui, sans-serif; }
      #boot-error { display: none; margin: 2rem auto; max-width: 560px; padding: 1.2rem; border: 1px solid #ff5c7a; border-radius: 12px; }
    </style>
    <script>
      // Shows a readable message instead of a white screen if the app fails to start.
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el || window.__booted) return;
          el.style.display = 'block';
          el.textContent = msg;
        }
        window.addEventListener('DOMContentLoaded', function () {
          if (location.protocol === 'file:') {
            show('This app cannot run from a file. Start it with "npm run dev" (or "npm run preview" after a build) and open the http://localhost address.');
          }
        });
        window.addEventListener('error', function (e) {
          var t = e.target;
          show(t && t.src ? 'Failed to load ' + t.src : 'Startup error: ' + (e.message || 'unknown'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Startup error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="boot-error" role="alert"></div>
    <header id="navbar"></header>
    <main id="app" aria-live="polite"></main>
    <div id="toasts" aria-live="assertive"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
