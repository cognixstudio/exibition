<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060f" />
    <title>Gesture Lab</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <style>
      html, body { margin: 0; background: #07060f; color: #ecebff; font-family: system-ui, sans-serif; }
      #boot-error { display: none; margin: 2rem auto; max-width: 560px; padding: 1.2rem; border: 1px solid #ff5c7a; border-radius: 12px; }
      /* ---------- Launch splash: the icon drops in from the top ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
        background:
          radial-gradient(60rem 40rem at 10% -10%, rgba(255, 47, 208, 0.18), transparent 60%),
          radial-gradient(50rem 40rem at 100% 0%, rgba(25, 243, 255, 0.16), transparent 60%),
          #07060f;
        transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
      }
      #splash.leave { opacity: 0; transform: translateY(-3%) scale(1.03); visibility: hidden; pointer-events: none; }
      .splash-stage { position: relative; width: 112px; height: 112px; }
      .splash-icon {
        width: 112px; height: 112px; display: block; border-radius: 26px;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 0 22px rgba(25, 243, 255, 0.45)) drop-shadow(0 0 40px rgba(255, 47, 208, 0.35));
        animation: splash-drop 1.15s cubic-bezier(0.4, 0, 0.6, 1) both;
      }
      .splash-ring {
        position: absolute; left: 50%; bottom: -6px; width: 112px; height: 24px; margin-left: -56px;
        border-radius: 50%; border: 2px solid #19f3ff; opacity: 0;
        animation: splash-ripple 0.9s ease-out 0.62s both;
      }
      .splash-ring.two { border-color: #ff2fd0; animation-delay: 0.78s; }
      .splash-title {
        margin: 0.4rem 0 0; font: 700 1.6rem/1 system-ui, sans-serif; letter-spacing: -0.02em; color: #ecebff;
        opacity: 0; animation: splash-rise 0.6s ease-out 1.0s both;
      }
      .splash-sub { margin: 0; font: 0.9rem system-ui, sans-serif; color: #9b98c4; opacity: 0; animation: splash-rise 0.6s ease-out 1.15s both; }
      .splash-bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; opacity: 0; animation: splash-rise 0.4s ease-out 1.2s both; }
      .splash-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #19f3ff, #ff2fd0); animation: splash-load 1.1s ease-in-out infinite; }
      @keyframes splash-drop {
        0%   { transform: translateY(-70vh) scale(1, 1.18); opacity: 0; }
        10%  { opacity: 1; }
        54%  { transform: translateY(0) scale(1, 1.1); animation-timing-function: ease-out; }
        62%  { transform: translateY(0) scale(1.22, 0.74); }
        76%  { transform: translateY(-34px) scale(0.94, 1.06); animation-timing-function: ease-in; }
        88%  { transform: translateY(0) scale(1.08, 0.92); }
        100% { transform: translateY(0) scale(1, 1); }
      }
      @keyframes splash-ripple { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon, .splash-title, .splash-sub, .splash-bar { animation: splash-fade 0.4s ease both; }
        .splash-ring, .splash-bar i { display: none; }
        @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
      }
    </style>
    <script>
      // Shows a readable message instead of a white screen if the app fails to start.
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el || window.__booted) return;
          el.style.display = 'block';
          el.textContent = msg;
        }
        window.addEventListener('DOMContentLoaded', function () {
          if (location.protocol === 'file:') {
            show('This app cannot run from a file. Start it with "npm run dev" (or "npm run preview" after a build) and open the http://localhost address.');
          }
        });
        window.addEventListener('error', function (e) {
          var t = e.target;
          show(t && t.src ? 'Failed to load ' + t.src : 'Startup error: ' + (e.message || 'unknown'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Startup error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Gesture Lab">
      <div class="splash-stage">
        <span class="splash-ring"></span><span class="splash-ring two"></span>
        <img class="splash-icon" src="favicon.svg" alt="" width="112" height="112" />
      </div>
      <h1 class="splash-title">Gesture Lab</h1>
      <p class="splash-sub">Control everything with your hands</p>
      <div class="splash-bar"><i></i></div>
    </div>
    <div id="boot-error" role="alert"></div>
    <header id="navbar"></header>
    <main id="app" aria-live="polite"></main>
    <div id="toasts" aria-live="assertive"></div>
    <script>
      // Hide the launch splash once the drop animation has played AND the app has started
      // (or after a safety timeout, so it can never get stuck).
      (function () {
        var start = Date.now(), MIN = 2200, MAX = 7000;
        function hide() {
          var el = document.getElementById('splash');
          if (!el) return;
          el.classList.add('leave');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650);
        }
        (function tick() {
          var t = Date.now() - start;
          var err = document.getElementById('boot-error');
          var failed = err && err.style.display === 'block';
          if (failed || (window.__booted && t >= MIN) || t >= MAX) hide();
          else setTimeout(tick, 100);
        })();
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
